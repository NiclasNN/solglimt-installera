<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Installera Solglimt</title>
<style>
  :root { --bg: #F9F4E7; --ink: #1E1A16; --ink2: #5B5146; --accent: #B23E17; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15110D; --ink: #F5EDDD; --ink2: #C9BCA7; --accent: #FF9A66; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 Georgia, "Times New Roman", serif; }
  main { max-width: 440px; margin: 0 auto; padding: 48px 20px; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 25px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  h1 { margin: 22px 0 6px; font-size: 34px; letter-spacing: -.02em; }
  p { color: var(--ink2); margin: 0 0 14px; }
  a.btn { display: block; margin: 28px 0 18px; padding: 18px; border-radius: 14px; background: var(--ink); color: var(--bg); font: 700 19px/1 -apple-system, system-ui, sans-serif; text-decoration: none; }
  ol { text-align: left; color: var(--ink2); padding-left: 22px; }
  small { display: block; margin-top: 26px; color: var(--ink2); font: 13px/1.4 -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="">
  <h1>Solglimt</h1>
  <p>Dagens glada nyheter – som en riktig tidning.</p>
  <a class="btn" href="itms-services://?action=download-manifest&amp;url=https://niclasnn.github.io/solglimt-installera/manifest.plist">Installera Solglimt</a>
  <ol>
    <li>Öppna den här sidan i Safari på din iPhone.</li>
    <li>Tryck på knappen och sedan på <b>Installera</b>.</li>
    <li>Appen uppdateras – allt du har sparat finns kvar.</li>
  </ol>
  <small>Fungerar bara på de telefoner som är registrerade för appen.</small>
</main>
</body>
</html>
